<div class="container-fluid padding2030 position-relative h-100" fxLayout="column">    
    <header fxFlex="73px">
        <span class="mat-display-1">Profiles</span>
        <hr>
    </header>  
    <div style="position: absolute; bottom: 20px; right: 20px;">
        <button mat-fab color="primary" matTooltip="Add new profile" matTooltipPosition="above" routerLink="/account/new-profile">            
            <fa-icon [icon]="faPlus" class="icon-21"></fa-icon>
        </button>
    </div>
    <div class="container-fluid" fxLayoutGap="30px">
        <div fxFlex *ngIf="profilesData.length > 0">
            <div class="text-center" *ngIf="profilesData.length > 20">
                <mat-form-field appearance="outline" class="w-50">
                    <fa-icon [icon]="faSearch" matPrefix></fa-icon>
                    <mat-label>Search user</mat-label>
                    <input matInput>
                    <mat-hint>Enter name or username of person to search.</mat-hint>        
                  </mat-form-field>
            </div>
            <div class="">
                <div class="container-fluid p-0" fxLayout="row wrap" fxLayoutAlign="center">
                    <div fxFlex="260px" *ngFor="let data of profilesData"  class="p-3 position-relative">
                        <account-profile-card [cardData]="data"></account-profile-card>
                    </div>                                    
                </div>
            </div>
        </div>

        <div fxFlex *ngIf="profilesData.length == 0">
            <div style="width: 500px;" class="centralize text-center">
                <img src="assets/illustrations/empty-illustration.svg">
                <span class="mat-display-1 display-block m-0">No profile to view.</span>
            </div>
        </div>
    </div>
</div>
