<div class="container-fluid padding2030 position-relative h-100" fxLayout="column">    
    <header fxFlex="73px">
        <span class="mat-display-1">Profiles</span>
        <hr>
    </header>  
    <div class="text-center" *ngIf="profilesData.length > 20">
        <mat-form-field appearance="outline" class="w-25">
            <fa-icon [icon]="faSearch" matPrefix></fa-icon>
            <mat-label>Search user</mat-label>
            <input matInput>
            <mat-hint>Enter name or username of person to search.</mat-hint>        
          </mat-form-field>
    </div>
    <div fxFlex class="">
        <div class="container-fluid p-0" fxLayout="row wrap" fxLayoutAlign="center">
            <div fxFlex="250px" *ngFor="let data of profilesData"  class="p-1">
                <account-profile-card [cardData]="data"></account-profile-card>
                                
            </div>                        
            <!-- <div fxFlex class="position-relative" *ngIf="profilesData.length == 0">                 
                <div style="width: 500px;" class="text-center m-auto" >
                    <img src="assets/illustrations/account-illustration.svg" style="width: 500px;">
                    <span class="display-block mat-display-1">Select profile to view.</span>
                </div>
            </div> -->
        </div>
    </div>
</div>
