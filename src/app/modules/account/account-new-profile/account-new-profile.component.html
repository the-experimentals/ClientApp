<div class="container-fluid p-0 h-100" fxLayout="column">
    <div fxFlex class="padding2030 scrollable">
        <header>
            <div>
                <fa-icon [icon]="faLongArrowAltLeft" class="pointer" style="font-size: 2rem;" routerLink="/account"></fa-icon>
            </div>
            <span class="mat-display-1">New profile</span>
            <hr/>
        </header>

        <form style="width: 800px;" class="margin-auto">
            <header class="text-center">
                <span class="mat-h4 m-0">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                </span>
                <hr class="m-0"/>
            </header>
    
            <mat-tab-group mat-align-tabs="center">
                <mat-tab>
                <ng-template mat-tab-label>
                    <fa-icon [icon]="faIdBadge" style="font-size: 21px;" class="mr-1"></fa-icon>                 
                    Account information
                </ng-template>                
                </mat-tab>
            </mat-tab-group>
            <div class="padding2030 container-fluid">
                <div class="row">
                    <div class="col-6">
                        <mat-form-field appearance="outline" class="w-100"> 
                            <mat-label>Username</mat-label>
                            <fa-icon [icon]="faUser" matPrefix></fa-icon>
                            <input matInput>                        
                          </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <mat-form-field appearance="outline" class="w-100"> 
                            <mat-label>Password</mat-label>
                            <fa-icon [icon]="faUser" matPrefix></fa-icon>
                            <input matInput>                        
                          </mat-form-field>
                    </div>
                    <div class="col-6">
                        <mat-form-field appearance="outline" class="w-100"> 
                            <mat-label>Confirm password</mat-label>
                            <fa-icon [icon]="faUser" matPrefix></fa-icon>
                            <input matInput>                        
                          </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <mat-form-field appearance="outline" class="w-100"> 
                            <mat-label>First name</mat-label>
                            <fa-icon [icon]="faUser" matPrefix></fa-icon>
                            <input matInput>                        
                          </mat-form-field>
                    </div>
                    <div class="col-6">
                        <mat-form-field appearance="outline" class="w-100"> 
                            <mat-label>Last name</mat-label>
                            <fa-icon [icon]="faUser" matPrefix></fa-icon>
                            <input matInput>                        
                          </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Language</mat-label>
                            <fa-icon [icon]="faLanguage" matPrefix></fa-icon>
                            <mat-select>                        
                              <mat-option value="us-EN" selected>
                                English
                              </mat-option>
                            </mat-select>
                          </mat-form-field>
                    </div>
                    <div class="col-6">
                        <mat-form-field appearance="outline" class="w-100"> 
                            <mat-label>Email</mat-label>
                            <fa-icon [icon]="faUser" matPrefix></fa-icon>
                            <input matInput>                        
                          </mat-form-field>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div fxFlex="60px" class="text-right padding1015 shadow-1">
        <button mat-raised-button color="primary" routerLink="/account/new-profile">Save</button>    
    </div>
</div>
