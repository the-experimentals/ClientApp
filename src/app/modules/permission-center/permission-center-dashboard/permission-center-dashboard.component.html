<div class="padding2030 container-fluid h-100" fxLayout="column">
    <header fxFlex="73px">
        <span class="mat-display-1">Permission Center</span>
        <hr>
    </header>
    <div fxFlex class="container-fluid p-0" fxLayoutGap="10px">
        <div fxFlex="280px" class="p-2" style="background-color: var(--combo-black-white);">
            <div class="">
                <div matRipple class="p-2 display-inline-block pointer">
                    <fa-icon [icon]="faPlus"></fa-icon>
                </div>
                <div matRipple class="p-2 display-inline-block pointer">                    
                    <fa-icon [icon]="faMinus"></fa-icon>
                </div>
                <hr class="m-0" style="background-color: var(--combo-white-black);"/>
            </div>
            <div class="mt-2">
                <!-- <div style="width: 200px;" class="text-center">
                    <img src="assets/illustrations/empty-illustration.svg">
                </div> -->
            </div>
        </div>
        <div fxFlex>
            <div style="width:500px" class="margin-auto text-center">
                <img src="assets/illustrations/security-on-illustration.svg">
                <span class="display-block mat-display-1">Select users to view permissions</span>
            </div>
        </div>
    </div>
</div>
