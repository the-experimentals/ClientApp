<div class="container-fluid p-0" fxLayoutAlign="center">
    <mat-card fxFlex="400px" class="mt-5 text-center">
        <div *ngIf="errorCode==0">
            Client cannot connect to the server
        </div>
        <div *ngIf="errorCode==500">
            Internal server error
        </div>
        <div *ngIf="errorCode==502">
            Bad gateway
        </div>
    </mat-card>
</div>
