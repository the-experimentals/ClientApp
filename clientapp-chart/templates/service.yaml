apiVersion: v1
kind: Service
metadata:
  name: {{ include "clientapp-chart.fullname" . }}
  annotations:
    "consul.hashicorp.com/service-sync": "true"
spec:
  type: {{ .Values.service.type }}
  ports:
{{- range $key, $value := .Values.service.Ports }}
  - name: {{ $key }}
{{ toYaml $value | indent 4 }}
{{- end }}
  selector: 
    app: {{ include "clientapp-chart.fullname" . }}
